<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tic Tac Grace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="gameWrapper">

<div id="welcomeScreen">

    <div id="menuContent">

        <div id="menuImage"></div>

        <div id="menuButtons">

            <button id="walterBtn">Walter vs Computer</button>
            <button id="rumiBtn">Rumi vs Computer</button>
            <button id="twoPlayerBtn">Two Players</button>
        </div>

    </div>

</div>



        <div id="scoreboard">
            <div>Walter (X): <span id="xScore">0</span></div>
            <div>Rumi (O): <span id="oScore">0</span></div>
            <div>Ties: <span id="tieScore">0</span></div>
        </div>

        <div id="gameContainer">
            <div id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>

        <div id="resultOverlay">
            <div id="resultBox">
                <div id="resultMessage"></div>
                <button id="retryBtn">PLAY AGAIN</button>
            </div>
        </div>



    </div>

    <script src="game.js"></script>
</body>

</html>
